syntax = "proto3";

package aitask.v1;

option go_package = "gitea.ezer.heiyu.space/iwen-conf/aitask/core/internal/rpc/gen/aitask/v1;aitaskv1";

message Error {
  string code = 1;
  string message = 2;
  bool retriable = 3;
}

message AgentIdentity {
  string agent_id = 1;
  string agent_type = 2;
  string role = 3;
  repeated string scopes = 4;
  repeated string allowed_projects = 5;
}

message ProjectRef {
  string project_id = 1;
  string name = 2;
  string status = 3;
}

message SessionRef {
  string session_id = 1;
  string status = 2;
}

message SkillRef {
  string name = 1;
  string source = 2;
  string version = 3;
}

message ContextRef {
  string uri = 1;
  string title = 2;
  int32 estimated_tokens = 3;
}

message ArtifactRef {
  string name = 1;
  string artifact_type = 2;
  string uri = 3;
}

message NextAction {
  string type = 1;
  string message = 2;
  string command = 3;
}
