syntax = "proto3";

package aitask.v1;

option go_package = "gitea.ezer.heiyu.space/iwen-conf/aitask/core/internal/rpc/gen/aitask/v1;aitaskv1";

import "aitask/v1/common.proto";
import "aitask/v1/context.proto";

service BootstrapService {
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
}

message BootstrapRequest {
  string project_id = 1;
}

message RoomSnapshot {
  string room_id = 1;
  string recent_summary = 2;
  int32 unread_mentions = 3;
}

message BootstrapResponse {
  AgentIdentity identity = 1;
  ProjectRef project = 2;
  SessionRef session = 3;
  AgentRun run = 4;
  repeated ContextRef context_refs = 5;
  RoomSnapshot room = 6;
  NextAction next_action = 7;
}
