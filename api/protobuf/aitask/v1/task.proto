syntax = "proto3";

package aitask.v1;

option go_package = "gitea.ezer.heiyu.space/iwen-conf/aitask/core/internal/rpc/gen/aitask/v1;aitaskv1";

import "aitask/v1/common.proto";

service TaskService {
  rpc GetCurrentTask(GetCurrentTaskRequest) returns (GetCurrentTaskResponse);
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
}

message TaskDelegation {
  string delegated_by_type = 1;
  string delegated_by_operator_label = 2;
  string delegated_by_agent_id = 3;
  string delegated_at = 4;
}

message Task {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string status = 4;
  string assignee_agent_id = 5;
  string assignee_agent_type = 6;
  string active_run_id = 7;
  string last_heartbeat_at = 8;
  TaskDelegation delegation = 9;
  repeated SkillRef required_skills = 10;
  string required_model = 11;
  string output_contract = 12;
  int32 priority = 13;
}

message GetCurrentTaskRequest {
  string project_id = 1;
}

message GetCurrentTaskResponse {
  Task task = 1;
  NextAction next_action = 2;
}

message StartTaskRequest {
  string project_id = 1;
  string task_id = 2;
  string run_id = 3;
}

message StartTaskResponse {
  string task_id = 1;
  string status = 2;
  string active_run_id = 3;
  string started_at = 4;
}

message SubmitTaskRequest {
  string project_id = 1;
  string task_id = 2;
  string run_id = 3;
  string result_markdown = 4;
  repeated ArtifactRef artifacts = 5;
}

message SubmitTaskResponse {
  string task_id = 1;
  string status = 2;
  NextAction next_action = 3;
}
